# ---------------------------------------------------------------------------
# Innowise.D3S1T1 — local development stack
#
# Brings up the whole system on one bridge network:
#   weakapp    unstable external API (provided)      -> :${WEAKAPP_PORT}
#   rabbitmq   message queue + management UI         -> :${RABBITMQ_MGMT_PORT}
#   mssql      MS SQL Server (Developer edition)     -> internal, see override
#   ingestor   polls weakapp, publishes to RabbitMQ  -> :${INGESTOR_PORT}
#   processor  consumes RabbitMQ, persists to MS SQL -> :${PROCESSOR_PORT}
#   gateway    GraphQL read API over MS SQL          -> :${GRAPHQL_PORT}/graphql
#
# The notification service and frontend are not implemented yet; ready-to-use
# stubs are at the bottom of this file (commented out).
#
# Service images are built from the sibling repositories, so all four repos
# must be cloned next to each other:
#
#   D3S1T1/
#     Innowise.D3S1T1.DataIngestor/
#     Innowise.D3S1T1.DataProcessor/
#     Innowise.D3S1T1.Gateway/
#     Innowise.D3S1T1.Infrastructure/   <-- you are here
#     Innowise.D3S1T1.WeakApp/
#
# Usage:  cp .env.example .env  &&  docker compose up -d --build
# ---------------------------------------------------------------------------

name: d3s1t1

services:
  # -------------------------------------------------------------------------
  # Unstable external API — the data source. Intentionally flaky, so it is
  # NOT gated by a healthcheck: the ingestor is expected to cope with it
  # failing (Polly retry / circuit breaker are configured on its side).
  # -------------------------------------------------------------------------
  weakapp:
    build:
      context: ../Innowise.D3S1T1.WeakApp
      dockerfile: Dockerfile
    image: d3s1t1/weakapp:local
    container_name: d3s1t1-weakapp
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "${WEAKAPP_PORT:-8080}:8080"
    networks: [d3s1t1]
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # Message queue. MassTransit declares the "metric-readings" fanout exchange
  # and the "metric-readings-processor" queue itself, so no definitions file
  # is needed.
  # -------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: d3s1t1-rabbitmq
    hostname: d3s1t1-rabbitmq          # keep the node name stable across restarts
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"   # management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test:
        - CMD-SHELL
        - rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_local_alarms
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks: [d3s1t1]
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # MS SQL Server. The processor applies EF Core migrations on startup (in
  # the Development environment), which also creates the database — no init
  # script required.
  # -------------------------------------------------------------------------
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: d3s1t1-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [d3s1t1]
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # Data Ingestor — Quartz job polls the weak API every 10s and publishes
  # batches to the "metric-readings" fanout exchange.
  # -------------------------------------------------------------------------
  ingestor:
    build:
      context: ../Innowise.D3S1T1.DataIngestor
      dockerfile: src/DataIngestor.AppHost/Dockerfile
      args:
        BUILD_CONFIGURATION: ${BUILD_CONFIGURATION:-Release}
    image: d3s1t1/data-ingestor:local
    container_name: d3s1t1-ingestor
    depends_on:
      rabbitmq:
        condition: service_healthy
      weakapp:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # HTTP only in local dev; UseHttpsRedirection() no-ops without an HTTPS port.
      ASPNETCORE_URLS: http://+:8080
      # Trailing slash is required — HttpClient.BaseAddress resolves "meters" relatively.
      Integrations__WeakAPI__URL: http://weakapp:8080/
      Integrations__WeakAPI__ApiKey: ${WEAKAPP_API_KEY:-supersecret}
      RabbitMQ__Host: rabbitmq
      RabbitMQ__VirtualHost: ${RABBITMQ_VHOST:-/}
      RabbitMQ__Username: ${RABBITMQ_USER:-guest}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${INGESTOR_PORT:-5001}:8080"
    networks: [d3s1t1]
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # Data Processor — consumes "metric-readings-processor" and writes to MS SQL.
  #
  # Its Dockerfile restores from a private GitHub Packages feed, so the build
  # needs a PAT with read:packages exported as GITHUB_TOKEN (see README).
  # -------------------------------------------------------------------------
  processor:
    build:
      context: ../Innowise.D3S1T1.DataProcessor
      dockerfile: src/DataProcessor.AppHost/Dockerfile
      args:
        BUILD_CONFIGURATION: ${BUILD_CONFIGURATION:-Release}
      secrets:
        - github_token
    image: d3s1t1/data-processor:local
    container_name: d3s1t1-processor
    depends_on:
      rabbitmq:
        condition: service_healthy
      mssql:
        condition: service_healthy
    environment:
      # Development also switches on ApplyPendingMigrations() at startup.
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DataProcessorDb: >-
        Server=mssql,1433;Database=${MSSQL_DATABASE:-DataProcessor};User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True;MultipleActiveResultSets=True
      RabbitMQ__Host: rabbitmq
      RabbitMQ__VirtualHost: ${RABBITMQ_VHOST:-/}
      RabbitMQ__Username: ${RABBITMQ_USER:-guest}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${PROCESSOR_PORT:-5002}:8080"
    networks: [d3s1t1]
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # GraphQL API Gateway (HotChocolate) — read-only over MS SQL, serves the FE.
  #
  # Unlike the processor, this image restores nothing from the private GitHub
  # Packages feed, so it takes no `github_token` build secret.
  # -------------------------------------------------------------------------
  gateway:
    build:
      context: ../Innowise.D3S1T1.Gateway
      dockerfile: src/Gateway.AppHost/Dockerfile
      args:
        BUILD_CONFIGURATION: ${BUILD_CONFIGURATION:-Release}
    image: d3s1t1/gateway:local
    container_name: d3s1t1-gateway
    depends_on:
      mssql:
        condition: service_healthy
      processor:
        condition: service_started      # processor owns the EF migrations
    environment:
      # Development also serves the Nitro IDE at /graphql and the / -> /graphql
      # redirect; GraphQL:AllowIntrospection is governed separately.
      ASPNETCORE_ENVIRONMENT: Development
      # Development otherwise means the human-readable console template. In a
      # container the reader is `docker logs` and, later, a collector - so keep
      # the compact-JSON console here even though the environment is Development.
      Serilog__UseJsonConsole: "true"
      # HTTP only in local dev; the app deliberately never calls
      # UseHttpsRedirection(), so there is nothing to redirect to.
      ASPNETCORE_URLS: http://+:8080
      # Read-only consumer of the schema the processor migrates. Same server and
      # database as ConnectionStrings__DataProcessorDb above, different key.
      ConnectionStrings__MetricsDb: >-
        Server=mssql,1433;Database=${MSSQL_DATABASE:-DataProcessor};User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True;MultipleActiveResultSets=True
      Cors__AllowedOrigins__0: http://localhost:${FRONTEND_PORT:-3000}
    ports:
      - "${GRAPHQL_PORT:-5003}:8080"    # /graphql + Nitro UI
    # /health runs the metrics-db check, so this gates on the database actually
    # being queryable. The .NET runtime image ships no curl or wget, but it does
    # ship bash — hence the /dev/tcp redirection instead of an HTTP client.
    # CMD (not CMD-SHELL): /bin/sh in this image is dash, which has no /dev/tcp.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -q ' 200 '
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [d3s1t1]
    restart: unless-stopped

  # =========================================================================
  # NOT IMPLEMENTED YET — uncomment as each service lands.
  # =========================================================================

  # Notification Service (SignalR) — pushes real-time updates to the FE.
  # notification-api:
  #   build:
  #     context: ../Innowise.D3S1T1.NotificationApi
  #     dockerfile: src/NotificationApi.AppHost/Dockerfile
  #     secrets:
  #       - github_token
  #   image: d3s1t1/notification-api:local
  #   container_name: d3s1t1-notification-api
  #   depends_on:
  #     rabbitmq:
  #       condition: service_healthy
  #   environment:
  #     ASPNETCORE_ENVIRONMENT: Development
  #     ASPNETCORE_URLS: http://+:8080
  #     RabbitMQ__Host: rabbitmq
  #     RabbitMQ__VirtualHost: ${RABBITMQ_VHOST:-/}
  #     RabbitMQ__Username: ${RABBITMQ_USER:-guest}
  #     RabbitMQ__Password: ${RABBITMQ_PASSWORD:-guest}
  #   ports:
  #     - "${NOTIFICATION_PORT:-5004}:8080"
  #   networks: [d3s1t1]
  #   restart: unless-stopped

  # Frontend (React/Angular + Apollo) — dashboards and charts.
  # frontend:
  #   build:
  #     context: ../Innowise.D3S1T1.Frontend
  #     dockerfile: Dockerfile
  #   image: d3s1t1/frontend:local
  #   container_name: d3s1t1-frontend
  #   depends_on:
  #     gateway:
  #       condition: service_healthy
  #   environment:
  #     # Browser-side URLs, so they must be host-reachable, not compose DNS.
  #     VITE_GRAPHQL_URL: http://localhost:${GRAPHQL_PORT:-5003}/graphql
  #     VITE_SIGNALR_URL: http://localhost:${NOTIFICATION_PORT:-5004}/hubs/metrics
  #   ports:
  #     - "${FRONTEND_PORT:-3000}:80"
  #   networks: [d3s1t1]
  #   restart: unless-stopped

networks:
  d3s1t1:
    driver: bridge

volumes:
  rabbitmq-data:
  mssql-data:

secrets:
  # Build-time only: consumed by `RUN --mount=type=secret,id=github_token`.
  github_token:
    environment: GITHUB_TOKEN
